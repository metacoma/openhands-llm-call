services:
  openhands_llm:
    build:
      context: .
      dockerfile: openhands_llm/Dockerfile
    ports:
      - "0.0.0.0:${OPENHANDS_LLM_PORT:-8001}:8000"
    environment:
      - OPENHANDS_URL=${OPENHANDS_URL:-http://localhost:3000}
      - OPENHANDS_API_KEY=${OPENHANDS_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    restart: unless-stopped

  mcp_agent:
    build:
      context: .
      dockerfile: mcp_agent/Dockerfile
    ports:
      - "0.0.0.0:${MCP_AGENT_PORT:-8002}:8000"
    environment:
      - OPENHANDS_URL=http://openhands_llm:8000
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=8000
    depends_on:
      - openhands_llm
    restart: unless-stopped
