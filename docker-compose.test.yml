services:
  mock_server:
    build:
      context: .
      dockerfile: openhands_llm/Dockerfile
    ports:
      - "${MOCK_SERVER_PORT:-8003}:8000"
    command: uvicorn openhands_llm.mock_server:app --host 0.0.0.0 --port 8000
    environment:
      - MOCK_DELAY=${MOCK_DELAY:-60}
    restart: unless-stopped

  openhands_llm:
    build:
      context: .
      dockerfile: openhands_llm/Dockerfile
    ports:
      - "${OPENHANDS_LLM_PORT:-8004}:8000"
    environment:
      - OPENHANDS_URL=http://mock_server:8000
      - OPENHANDS_API_KEY=mock-api-key
      - LLM_MODEL=mock-model
    depends_on:
      - mock_server
    restart: unless-stopped

  mcp_agent:
    build:
      context: .
      dockerfile: mcp_agent/Dockerfile
    ports:
      - "${MCP_AGENT_PORT:-8005}:8000"
    environment:
      - OPENHANDS_URL=http://openhands_llm:8000
    depends_on:
      - openhands_llm
    restart: unless-stopped
